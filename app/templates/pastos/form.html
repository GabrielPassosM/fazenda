{% extends "base.html" %}

{% block title %}Editar Pasto | {{ app_name }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg">
    <div class="mb-6">
        <a
            href="/pastos"
            class="inline-flex items-center gap-1 text-xs font-semibold text-slate-500 hover:text-slate-800"
        >
            ← Voltar para a listagem de pastos
        </a>
        <h1 class="mt-2 text-2xl font-bold tracking-tight text-slate-900">
            Editar Pasto
        </h1>
        <p class="mt-1 text-sm text-slate-600">
            Atualize o nome do pasto selecionado.
        </p>
    </div>

    <form
        method="post"
        action="/pastos/{{ pasto.id }}/editar"
        class="rounded-xl border border-slate-200 bg-white p-6 shadow-2xs space-y-5"
    >
        <div>
            <label for="nome" class="block text-xs font-semibold uppercase tracking-wide text-slate-600 mb-1">
                Nome do Pasto *
            </label>
            <input
                id="nome"
                type="text"
                name="nome"
                value="{{ form_data.nome }}"
                required
                autofocus
                placeholder="Ex: Pasto da Represa"
                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold text-slate-900 focus:border-emerald-600 focus:outline-none focus:ring-1 focus:ring-emerald-600"
            >
        </div>

        <div class="flex items-center justify-end gap-3">
            <a
                href="/pastos"
                class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
            >
                Cancelar
            </a>
            <button
                type="submit"
                class="rounded-lg bg-emerald-700 px-5 py-2 text-sm font-semibold text-white shadow-2xs transition hover:bg-emerald-800 cursor-pointer"
            >
                Salvar Alterações
            </button>
        </div>
    </form>
</div>
{% endblock %}
