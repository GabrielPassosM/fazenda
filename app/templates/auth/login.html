<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito — {{ app_name | default("Fazenda - Gestão de Rebanho") }}</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-full flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8 text-slate-900 antialiased">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="flex flex-col items-center text-center">
            <span class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-emerald-700 text-lg font-bold text-white shadow-sm">
                FZ
            </span>
            <h1 class="mt-4 text-2xl font-bold tracking-tight text-slate-900">
                Fazenda
            </h1>
            <p class="mt-1 text-sm text-slate-500">
                Gestão de Rebanho &amp; Pesagens
            </p>
        </div>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="rounded-xl border border-slate-200 bg-white px-6 py-8 shadow-xs sm:px-8">
            <h2 class="text-base font-semibold text-slate-900 mb-1">
                Acesso ao Sistema
            </h2>
            <p class="text-xs text-slate-500 mb-6">
                Digite a senha de acesso para continuar.
            </p>

            {% if error %}
            <div class="mb-5 flex items-center gap-2.5 rounded-lg border border-rose-200 bg-rose-50 px-3.5 py-3 text-sm text-rose-900">
                <span class="inline-flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-rose-600 text-xs font-bold text-white">!</span>
                <span class="font-medium">{{ error }}</span>
            </div>
            {% endif %}

            <form method="post" action="/login" class="space-y-5">
                <input type="hidden" name="next_url" value="{{ next_url | default('/') }}">

                <div>
                    <label for="senha" class="block text-sm font-medium text-slate-700 mb-1.5">
                        Senha de acesso
                    </label>
                    <div class="relative">
                        <input
                            id="senha"
                            name="senha"
                            type="password"
                            required
                            autofocus
                            autocomplete="current-password"
                            placeholder="••••••••"
                            class="block w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 pr-16 text-sm text-slate-900 placeholder-slate-400 focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-600/20"
                        >
                        <button
                            type="button"
                            onclick="const input = document.getElementById('senha'); const isPwd = input.type === 'password'; input.type = isPwd ? 'text' : 'password'; this.textContent = isPwd ? 'Ocultar' : 'Mostrar';"
                            class="absolute inset-y-0 right-0 flex items-center px-3 text-xs font-medium text-slate-500 hover:text-slate-800 cursor-pointer"
                        >
                            Mostrar
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    class="flex w-full justify-center rounded-lg bg-emerald-700 px-4 py-2.5 text-sm font-semibold text-white shadow-xs transition hover:bg-emerald-800 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:ring-offset-2 cursor-pointer"
                >
                    Entrar
                </button>
            </form>
        </div>
    </div>
</body>
</html>
